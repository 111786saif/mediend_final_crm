services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: mediend_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mediend_crm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Single app container. Nginx on the host proxies to 127.0.0.1:3000.
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        DEPLOY_COMMIT: ${DEPLOY_COMMIT:-unknown}
        DEPLOY_TIME: ${DEPLOY_TIME:-unknown}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://workspace.mediend.com}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: always
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-kuma-data:/app/data

  # One-off: seed CRM master dropdown data (hospitals, doctors, TPAs, anesthesia) from app/bd-insurance-dropdowns.txt
  # Requires migrations applied so HospitalMaster / DoctorMaster / TPAMaster / AnesthesiaMaster tables exist.
  # Usage: docker compose --profile tools run --rm seed-master-data
  seed-master-data:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["bun", "run", "db:seed:masters"]

  # One-off: fresh production DB bootstrap (schema + baseline + RBAC + users + masters + leads).
  # Requires employee JSON mounted; MySQL env vars in .env for lead sync.
  #
  # Full init:
  #   docker compose --profile tools run --rm \
  #     -v "/path/to/csvjson(5).json:/app/csvjson(5).json" \
  #     init-db -- --employees-json /app/csvjson(5).json --leads-from 2020-01-01
  #
  # Schema + reference data only (no users/leads):
  #   docker compose --profile tools run --rm init-db -- --skip-employees --skip-leads
  init-db:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["bun", "run", "scripts/init-db.ts"]

  # One-off: run Prisma migrations (apply all pending migrations)
  # Usage: docker compose --profile tools run --rm migrate-deploy
  # Fallback when Bun image cannot be pulled (Docker Hub timeout): use migrate-deploy-node instead
  migrate-deploy:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["bunx", "prisma", "migrate", "deploy"]

  # Same as migrate-deploy but uses Node.js (no Bun). Use when Docker Hub times out pulling oven/bun.
  # Usage: docker compose --profile tools run --rm --build migrate-deploy-node
  migrate-deploy-node:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  # One-off: run case-stages migration (same env as app, then exit)
  # Usage: docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  # One-off: seed users/employees from CSV backup (employee-backup-supabase.csv)
  # Usage: docker compose --profile tools run --rm \
  #   -v "/root/mediend.workspace/scripts/db/employee-backup-supabase.csv:/app/employees.csv" \
  #   seed-csv /app/employees.csv
  seed-csv:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["bun", "run", "scripts/seed-employees-from-csv.ts"]

  # One-off: seed users/employees from JSON and update BD number map
  # Usage: docker compose --profile tools run --rm -v "$(pwd)/csvjson(5).json:/app/csvjson(5).json" seed
  # Or with custom path: docker compose --profile tools run --rm -v "$(pwd)/path/to/file.json:/app/employees.json" seed npx tsx scripts/seed-employees-from-json.ts /app/employees.json
  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["bun", "run", "scripts/seed-employees-from-json.ts"]
    # Mount JSON and run. Custom path: docker compose run --rm seed -- /app/other.json

  # One-off: reset a single user's password to 12345678 (or a custom value).
  # Pass the email or employeeCode as an argument; optional 2nd arg = new password.
  # Usage: docker compose --profile tools run --rm reset-password vishal.sharma@mediend.com
  #    or: docker compose --profile tools run --rm reset-password 2563
  #    or: docker compose --profile tools run --rm reset-password vishal.sharma@mediend.com MyNewPass
  reset-password:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["bun", "run", "scripts/reset-password.js"]

  # One-off: seed holidays from app/holidays.json
  # Usage: docker compose --profile tools run --rm seed-holidays
  seed-holidays:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["npx", "tsx", "scripts/seed-holidays.ts"]

  # One-off: sync leads from MySQL
  # Usage: docker compose --profile tools run --rm sync-leads -- --from 2025-01-01
  # Full re-sync (server): docker compose --profile tools run --rm sync-leads -- --from 2020-01-01
  sync-leads:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["bun", "run", "scripts/sync-mysql-leads.ts"]

  # One-off: backfill numeric source/campaign names with resolved strings
  # Usage: docker compose --profile tools run --rm backfill-sources
  backfill-sources:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["bun", "run", "scripts/backfill-source-names.ts"]

  # One-off: sync historic attendance
  # Usage: docker compose --profile tools run --rm sync-attendance -- --from 2025-01-01
  sync-attendance:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["bun", "run", "scripts/sync-historic-attendance.ts"]

  # One-off: fix lead circles from MySQL (set circle string from MySQL Circle column)
  # Usage: docker compose --profile tools run --rm fix-lead-circles
  # Dry run: docker compose --profile tools run --rm fix-lead-circles -- --dry-run
  fix-lead-circles:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["bun", "run", "scripts/fix-lead-circles.ts"]

  # One-off: remap lead category and circle from numeric IDs to text (historic data)
  # Usage: docker compose --profile tools run --rm fix-lead-categories-circles
  # Dry run: docker compose --profile tools run --rm fix-lead-categories-circles -- --dry-run
  fix-lead-categories-circles:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["bun", "run", "scripts/fix-lead-categories-circles.ts"]

  # One-off: seed InsuranceMaster and TPAMaster companies
  # Usage: docker compose --profile tools run --rm seed-insurance-tpa
  seed-insurance-tpa:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["bun", "run", "scripts/seed-insurance-tpa.ts"]

  # One-off: backfill Lead.createdDate from MySQL create_date / LeadEntryDate.
  # Required after migration 20260506120000_rename_lead_date_to_assigned_date —
  # historic rows had createdDate populated from MySQL Lead_Date (the assign date).
  # Only updates rows where the new value differs; old value is preserved in assignedDate.
  # Usage: docker compose --profile tools run --rm backfill-created-date
  backfill-created-date:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["bun", "run", "scripts/backfill-created-date-from-mysql.ts"]

  # One-off: backfill PLRecord + DischargeSheet people/case/date/billing fields
  # from Lead + AdmissionRecord for historical rows. Only fills empty fields;
  # never overwrites manual PL edits.
  # Dry run: docker compose --profile tools run --rm backfill-pl-records -- --dry-run
  # Live:    docker compose --profile tools run --rm backfill-pl-records
  backfill-pl-records:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["bun", "run", "scripts/backfill-pl-records.ts"]

  # One-off: backfill Lead.hospitalName / ipdDrName / surgeonName from every
  # available source (discharge sheet, PL record, pre-auth) for leads where
  # hospitalName is still "Not Specified". Broader than backfill-hospital-doctor
  # (which only handles insurance-flow PREAUTH_COMPLETE+ leads).
  # Dry run: docker compose --profile tools run --rm backfill-all-hospitals -- --dry-run
  # Live:    docker compose --profile tools run --rm backfill-all-hospitals
  backfill-all-hospitals:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["bun", "run", "scripts/backfill-all-hospitals.ts"]

  # One-off: backfill Lead.hospitalName / ipdDrName from the pre-auth-approved
  # hospital for historical approved leads, so every dashboard (insurance, case
  # tracker, TL pipeline, compliance, PL) shows the post-approval hospital +
  # doctor consistently. Only corrects empty/stale values; scoped to
  # insurance-flow leads at PREAUTH_COMPLETE or beyond. New approvals are handled
  # automatically by the write-back in /api/pre-auth/[id]/approve.
  # Dry run: docker compose --profile tools run --rm backfill-hospital-doctor -- --dry-run
  # Live:    docker compose --profile tools run --rm backfill-hospital-doctor
  backfill-hospital-doctor:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["bun", "run", "scripts/backfill-hospital-doctor.ts"]

  # One-off: backfill conversionDate for IPD Done leads that have no surgery/admission date
  # Usage: docker compose --profile tools run --rm backfill-conversion-dates
  backfill-conversion-dates:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["bun", "run", "scripts/backfill-conversion-dates.ts"]

  # One-off: revert bad backfill that promoted leads to PL where caseStage was
  # NOT IPD_DONE/CASH_IPD_DONE. Dry run first:
  #   docker compose --profile tools run --rm revert-ipd-stage -- --dry-run
  # Live:
  #   docker compose --profile tools run --rm revert-ipd-stage
  revert-ipd-stage:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["bun", "run", "scripts/revert-ipd-stage-backfill.ts"]

  # One-off: import historical IPD PNL data from CSV
  # Usage: docker compose --profile tools run --rm import-ipd-pnl
  # Dry run: docker compose --profile tools run --rm import-ipd-pnl -- --dry-run
  import-ipd-pnl:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["bun", "run", "scripts/import-ipd-pnl-csv.ts"]

  # One-off: import historical daily campaign spend (CPL) from the legacy Excel
  # sheets. Two phases:
  #   1. Build mapping review CSV (default — no DB writes):
  #        docker compose --profile tools run --rm import-cpl-history
  #      Then download/edit scripts/cpl-mapping-review.csv (filter
  #      needs_review=YES_FIX, fill proposed_db_name where wanted), commit it,
  #      and re-deploy the image so the edited CSV is baked in.
  #   2. Apply (writes DailyCampaignSpend rows; idempotent — safe to re-run):
  #        docker compose --profile tools run --rm import-cpl-history -- --apply --fix-dec2025
  #
  # Requires scripts/cpl-backfill-data.json (extracted from the source xlsx
  # via the python pre-processor) and scripts/cpl-mapping-review.csv to be
  # present in the repo at build time. Override the createdBy attribution with
  #   -- --apply --created-by=<email>
  import-cpl-history:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["bun", "run", "scripts/import-cpl-history.ts"]

  # One-off: import historical compliance feedback from the team's Excel sheet
  # (Sheet1) into ComplianceCall rows. Matches by phone (last 10 digits) +
  # patient-name token overlap; only fills currently-NULL fields, never
  # overwrites; auto-derives `satisfaction` from "Overall Experience" text.
  #
  # Mount the xlsx into /app/feedback.xlsx and pass that path as the arg.
  # Dry run (default — no DB writes):
  #   docker compose --profile tools run --rm \
  #     -v "$(pwd)/Feedback sheet 2026 Jan.xlsx:/app/feedback.xlsx:ro" \
  #     import-compliance-feedback /app/feedback.xlsx
  # Live (writes to DB):
  #   docker compose --profile tools run --rm \
  #     -v "$(pwd)/Feedback sheet 2026 Jan.xlsx:/app/feedback.xlsx:ro" \
  #     import-compliance-feedback /app/feedback.xlsx --commit
  import-compliance-feedback:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["bun", "run", "scripts/import-compliance-feedback.ts"]

  # One-off: migrate lead pipeline stages and conversion dates from status
  # Usage: docker compose --profile tools run --rm migrate-lead-pipeline
  migrate-lead-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["bun", "run", "scripts/migrate-lead-pipeline-stages.ts"]

  # One-off: advance insurance-flow leads where BD had already marked IPD_DONE
  # under the old flow (admissionRecord.ipdStatus = 'IPD_DONE' but caseStage
  # still INITIATED) so they appear in Insurance's "Ready for Discharge" queue.
  # Idempotent — safe to re-run.
  # Usage: docker compose --profile tools run --rm migrate-ipd-done-handoff
  migrate-ipd-done-handoff:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["bun", "run", "scripts/migrate-ipd-done-handoff.ts"]

  # One-off: fix leave balances to March 2026 Excel values (no April accrual)
  # Usage: docker compose --profile tools run --rm fix-leave-balances
  # Runs fix-leave-balances-april2026.sql inside a transaction and prints
  # a verification table of every target employee's CL/SL/EL balances.
  fix-leave-balances:
    image: postgres:16-alpine
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint:
      - sh
      - -c
      - |
        set -e
        # Strip Prisma-only ?schema=... param that libpq (psql) rejects
        PG_URL=$$(echo "$$DATABASE_URL" | sed -E 's/[?&]schema=[^&]*//; s/\?&/?/; s/\?$$//')
        echo "=== Applying fix-leave-balances-april2026.sql ==="
        psql "$$PG_URL" -v ON_ERROR_STOP=1 -f /sql/fix-leave-balances-april2026.sql
        echo ""
        echo "=== Post-run verification: target employees ==="
        psql "$$PG_URL" -c "SELECT e.\"employeeCode\", u.\"name\", lt.\"code\" AS leave_type, lb.\"allocated\", lb.\"used\", lb.\"remaining\" FROM \"LeaveBalance\" lb JOIN \"Employee\" e ON e.\"id\" = lb.\"employeeId\" JOIN \"User\" u ON u.\"id\" = e.\"userId\" JOIN \"LeaveTypeMaster\" lt ON lt.\"id\" = lb.\"leaveTypeId\" WHERE lt.\"code\" IN ('CL','SL','EL') ORDER BY e.\"employeeCode\", lt.\"code\";"
        echo ""
        echo "=== Row counts by leave type ==="
        psql "$$PG_URL" -c "SELECT lt.\"code\", COUNT(*) AS rows, SUM(lb.\"allocated\") AS total_allocated FROM \"LeaveBalance\" lb JOIN \"LeaveTypeMaster\" lt ON lt.\"id\" = lb.\"leaveTypeId\" WHERE lt.\"code\" IN ('CL','SL','EL') GROUP BY lt.\"code\" ORDER BY lt.\"code\";"
    volumes:
      - ./fix-leave-balances-april2026.sql:/sql/fix-leave-balances-april2026.sql:ro

  # One-off: rebuild sales Team records from DepartmentTeam in SURGERY SALES
  # Usage: docker compose --profile tools run --rm rebuild-sales-teams
  rebuild-sales-teams:
    image: postgres:16-alpine
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint:
      - sh
      - -c
      - |
        psql "$DATABASE_URL" -f /scripts/db/rebuild-sales-teams.sql
    volumes:
      - ./scripts:/scripts:ro

  # One-off: seed TreatmentMaster with ATS data from prisma/seed-treatments.ts
  # Requires migrations applied so TreatmentMaster table exists.
  # Usage: docker compose --profile tools run --rm seed-treatments
  seed-treatments:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["bun", "run", "prisma/seed-treatments.ts"]

  # One-off: profile or reset May 2026 discharges back to IPD_DONE
  # Profile (see affected leads, no changes):
  #   docker compose --profile tools run --rm reset-discharges -- --profile
  # Dry run (simulate, no changes):
  #   docker compose --profile tools run --rm reset-discharges -- --dry-run
  # Live run (actually revert):
  #   docker compose --profile tools run --rm reset-discharges
  # One-off: backfill PLRecord actualImplantCost / actualInstrumentCost from
  # implantCost / instrumentsCost. Safe to re-run (only touches rows where
  # the actual value is still 0).
  # Dry run (see what would change, no DB writes):
  #   docker compose --profile tools run --rm backfill-actual-costs -- --dry-run
  # Live run (apply changes):
  #   docker compose --profile tools run --rm backfill-actual-costs
  backfill-actual-costs:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["bun", "run", "scripts/backfill-actual-costs.ts"]

  reset-discharges:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - /root/mediend.workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["bun", "run", "scripts/reset-may-2026-discharges.ts"]

volumes:
  pgdata:
  uptime-kuma-data:
