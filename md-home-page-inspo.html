<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MediEND — MD Command Center (AI-Powered)</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
--bg:#060911;--bg2:#0D1220;--bg3:#141B2D;--bg4:#1C2640;--bg5:#0F1525;
--border:rgba(148,163,194,0.07);--border2:rgba(148,163,194,0.12);
--text:#F0F4FA;--text2:#94A3C2;--text3:#5B6B8A;--text4:#3D4D6A;
--blue:#38BDF8;--blue-d:rgba(56,189,248,0.12);
--green:#34D399;--green-d:rgba(52,211,153,0.1);
--red:#F87171;--red-d:rgba(248,113,113,0.1);
--orange:#FB923C;--orange-d:rgba(251,146,60,0.1);
--purple:#A78BFA;--purple-d:rgba(167,139,250,0.1);
--teal:#2DD4BF;--teal-d:rgba(45,212,191,0.1);
--yellow:#FBBF24;--yellow-d:rgba(251,191,36,0.1);
--pink:#F472B6;--pink-d:rgba(244,114,182,0.1);
--ai-g:linear-gradient(135deg,#38BDF8,#A78BFA,#F472B6);
--r:8px;--r2:12px;--r3:16px;
--f:'DM Sans',sans-serif;--f2:'Outfit',sans-serif;
--t:.2s cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:14.5px;scroll-behavior:smooth}
body{font-family:var(--f);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:4px}

/* SIDEBAR */
.sb{width:240px;background:var(--bg2);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;z-index:100;display:flex;flex-direction:column;transition:transform .3s ease}
.sb-h{padding:18px 16px;border-bottom:1px solid var(--border)}
.sb-logo{display:flex;align-items:center;gap:10px}
.sb-ic{width:34px;height:34px;background:var(--ai-g);border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-family:var(--f2);font-weight:800;font-size:14px;color:#fff}
.sb-brand{font-family:var(--f2);font-weight:700;font-size:15px;background:var(--ai-g);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sb-sub{font-size:9.5px;color:var(--text4);letter-spacing:1.5px;text-transform:uppercase;font-weight:600}
.sb-nav{flex:1;padding:10px 8px;overflow-y:auto}
.sb-lbl{font-size:9px;font-weight:700;color:var(--text4);letter-spacing:1.8px;text-transform:uppercase;padding:14px 10px 5px}
.sb-i{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--r);color:var(--text3);cursor:pointer;transition:all var(--t);font-size:12.5px;font-weight:500;position:relative;margin-bottom:1px}
.sb-i:hover{background:rgba(255,255,255,0.03);color:var(--text2)}
.sb-i.on{background:var(--blue-d);color:var(--blue)}
.sb-i.on::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:16px;background:var(--blue);border-radius:0 3px 3px 0}
.sb-i svg{width:16px;height:16px;flex-shrink:0;opacity:.7}
.sb-i.on svg{opacity:1}
.sb-badge{margin-left:auto;font-size:9px;font-weight:600;padding:1px 6px;border-radius:8px;color:#fff}
.sb-i.ai-item{background:linear-gradient(135deg,rgba(56,189,248,0.06),rgba(167,139,250,0.06));border:1px solid rgba(167,139,250,0.1)}
.sb-i.ai-item .ai-sparkle{color:var(--purple);font-size:14px;margin-left:auto}
.sb-ft{padding:12px 14px;border-top:1px solid var(--border)}
.sb-u{display:flex;align-items:center;gap:8px;padding:7px;border-radius:var(--r)}
.sb-av{width:32px;height:32px;border-radius:50%;background:var(--ai-g);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#fff}
.sb-nm{font-size:12px;font-weight:600}.sb-rl{font-size:10px;color:var(--text4)}

/* MAIN */
.mn{margin-left:240px;min-height:100vh}
.tb{position:sticky;top:0;z-index:50;background:rgba(6,9,17,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 22px;display:flex;align-items:center;gap:12px}
.ham{display:none;background:none;border:none;color:var(--text2);cursor:pointer;padding:3px;flex-shrink:0}
.ham svg{width:20px;height:20px}
.tb-l{flex:1;min-width:0}
.tb-g{font-size:10.5px;color:var(--text4)}
.tb-t{font-family:var(--f2);font-size:18px;font-weight:700;letter-spacing:-.3px}
.tb-r{display:flex;align-items:center;gap:7px}
.tb-dt{font-size:10.5px;color:var(--text3);background:var(--bg3);padding:5px 10px;border-radius:var(--r);border:1px solid var(--border);font-family:var(--f2);font-weight:500;flex-shrink:0}
.tb-btn{width:34px;height:34px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg3);color:var(--text3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--t);position:relative;flex-shrink:0}
.tb-btn:hover{background:var(--bg4);color:var(--text)}
.tb-btn svg{width:15px;height:15px}
.tb-dot{position:absolute;top:5px;right:5px;width:6px;height:6px;background:var(--red);border-radius:50%;border:1.5px solid var(--bg3)}

/* CONTENT */
.ct{padding:20px 22px 40px}

/* AI BANNER */
.ai-banner{background:linear-gradient(135deg,rgba(56,189,248,0.08),rgba(167,139,250,0.08),rgba(244,114,182,0.06));border:1px solid rgba(167,139,250,0.12);border-radius:var(--r3);padding:18px 20px;margin-bottom:20px;position:relative;overflow:hidden}
.ai-banner::before{content:'';position:absolute;top:-50%;right:-20%;width:200px;height:200px;background:radial-gradient(circle,rgba(167,139,250,0.08),transparent 70%);pointer-events:none}
.ai-banner-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ai-banner-sparkle{font-size:20px}
.ai-banner-title{font-family:var(--f2);font-size:15px;font-weight:700;background:var(--ai-g);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ai-banner-time{font-size:10px;color:var(--text4);margin-left:auto;flex-shrink:0}
.ai-banner-text{font-size:12.5px;color:var(--text2);line-height:1.7}
.ai-banner-text strong{color:var(--text);font-weight:600}
.ai-bullets{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.ai-bullet{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--text2);line-height:1.5}
.ai-bullet-ic{font-size:14px;flex-shrink:0;margin-top:1px}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px}
.st{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:14px;position:relative;overflow:hidden;cursor:pointer;transition:all var(--t)}
.st:hover{border-color:var(--border2);transform:translateY(-1px)}
.st::after{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.st:nth-child(1)::after{background:var(--blue)}.st:nth-child(2)::after{background:var(--green)}.st:nth-child(3)::after{background:var(--orange)}.st:nth-child(4)::after{background:var(--red)}.st:nth-child(5)::after{background:var(--purple)}.st:nth-child(6)::after{background:var(--teal)}
.st-ic{font-size:15px;margin-bottom:8px}
.st-val{font-family:var(--f2);font-size:24px;font-weight:800;letter-spacing:-1px;line-height:1}
.st-lbl{font-size:10.5px;color:var(--text3);margin-top:3px}
.st-d{font-size:9.5px;font-weight:600;margin-top:5px;display:inline-flex;padding:2px 6px;border-radius:8px}
.st-d.up{background:var(--green-d);color:var(--green)}.st-d.dn{background:var(--red-d);color:var(--red)}

/* GRIDS */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px}
.gm{display:grid;grid-template-columns:1fr 340px;gap:16px;margin-bottom:20px}

/* PANEL */
.pn{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r3);overflow:hidden}
.pn.ai{border-color:rgba(167,139,250,0.12);background:linear-gradient(180deg,rgba(167,139,250,0.04),var(--bg3) 60px)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:6px}
.pt{font-family:var(--f2);font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
.pt .ai-tag{font-size:9px;background:var(--ai-g);color:#fff;padding:2px 7px;border-radius:10px;font-weight:700;letter-spacing:.3px}
.pc{background:var(--blue-d);color:var(--blue);font-size:10px;font-weight:600;padding:2px 7px;border-radius:7px}
.pa{display:flex;gap:4px}
.pb{padding:4px 10px;border-radius:var(--r);border:1px solid var(--border);background:transparent;color:var(--text3);font-size:10.5px;font-family:var(--f);cursor:pointer;transition:all var(--t)}
.pb:hover{background:var(--bg4);color:var(--text2)}
.pb.on{background:var(--blue-d);color:var(--blue);border-color:rgba(56,189,248,0.2)}
.pp{padding:16px}
.ps{max-height:380px;overflow-y:auto}

/* TABLE */
table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:600;color:var(--text4);text-transform:uppercase;letter-spacing:.5px;padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);background:var(--bg3);position:sticky;top:0}
td{padding:10px 12px;font-size:12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:rgba(255,255,255,0.01)}
.av-sm{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;vertical-align:middle;margin-right:7px}
.badge{font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap}
.b-g{background:var(--green-d);color:var(--green)}.b-r{background:var(--red-d);color:var(--red)}.b-o{background:var(--orange-d);color:var(--orange)}.b-b{background:var(--blue-d);color:var(--blue)}.b-p{background:var(--purple-d);color:var(--purple)}.b-t{background:var(--teal-d);color:var(--teal)}.b-y{background:var(--yellow-d);color:var(--yellow)}
.chart-box{position:relative;width:100%;max-height:220px}
canvas{max-width:100%}
.prog{height:5px;background:var(--bg);border-radius:3px;overflow:hidden}.prog-f{height:100%;border-radius:3px}

/* AI INSIGHT CARD */
.ai-card{background:linear-gradient(135deg,rgba(56,189,248,0.05),rgba(167,139,250,0.05));border:1px solid rgba(167,139,250,0.1);border-radius:var(--r2);padding:14px;margin-bottom:10px}
.ai-card-head{display:flex;align-items:center;gap:7px;margin-bottom:6px;font-size:12px;font-weight:600}
.ai-card-head .spark{font-size:14px}
.ai-card-text{font-size:11.5px;color:var(--text2);line-height:1.6}
.ai-card-text strong{color:var(--text)}
.ai-card-action{margin-top:8px;display:flex;gap:6px}
.ai-btn{padding:5px 12px;border-radius:6px;border:1px solid rgba(167,139,250,0.2);background:rgba(167,139,250,0.08);color:var(--purple);font-size:10.5px;font-family:var(--f);cursor:pointer;transition:all var(--t);font-weight:600}
.ai-btn:hover{background:rgba(167,139,250,0.15)}

/* SCORE */
.score-ring{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f2);font-size:22px;font-weight:800;margin:0 auto 8px;position:relative}
.score-ring::before{content:'';position:absolute;inset:0;border-radius:50%;border:4px solid var(--bg);opacity:.3}

/* CITY CARD */
.city-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r2);padding:14px;margin-bottom:8px;cursor:pointer;transition:all var(--t)}
.city-card:hover{border-color:var(--border2)}
.city-nm{font-size:13px;font-weight:600;margin-bottom:4px}
.city-sub{font-size:11px;color:var(--text3)}
.city-stats{display:flex;gap:14px;margin-top:8px}
.city-st{display:flex;flex-direction:column;align-items:center}
.city-st-v{font-family:var(--f2);font-size:16px;font-weight:700}
.city-st-l{font-size:9px;color:var(--text4);text-transform:uppercase}

/* SIDEBAR OVERLAY */
.s-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:99}.s-ov.show{display:block}

/* RESPONSIVE */
@media(max-width:1200px){.stats{grid-template-columns:repeat(3,1fr)}.g3{grid-template-columns:1fr 1fr}.gm{grid-template-columns:1fr}}
@media(max-width:900px){.sb{transform:translateX(-100%)}.sb.open{transform:translateX(0)}.mn{margin-left:0}.ham{display:flex}.stats{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}.gm{grid-template-columns:1fr}}
@media(max-width:600px){.ct{padding:14px 12px}.tb{padding:10px 12px}.stats{grid-template-columns:1fr 1fr;gap:8px}.st{padding:12px}.st-val{font-size:20px}.tb-dt{display:none}}
@media(max-width:380px){.stats{grid-template-columns:1fr}.st-val{font-size:18px}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.an{animation:fadeIn .35s ease forwards;opacity:0}.d1{animation-delay:.03s}.d2{animation-delay:.06s}.d3{animation-delay:.09s}.d4{animation-delay:.12s}.d5{animation-delay:.15s}.d6{animation-delay:.18s}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}.pulsing{animation:pulse 2s ease-in-out infinite}
</style>
</head>
<body>
<div class="s-ov" id="sOv" onclick="togSB()"></div>
<aside class="sb" id="sb">
  <div class="sb-h"><div class="sb-logo"><div class="sb-ic">M</div><div><div class="sb-brand">MediEND</div><div class="sb-sub">MD Command Center</div></div></div></div>
  <nav class="sb-nav">
    <div class="sb-lbl">Overview</div>
    <div class="sb-i on" data-p="home" onclick="go('home',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</div>
    <div class="sb-i ai-item" data-p="ai-daily" onclick="go('ai-daily',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>AI Daily Brief<span class="ai-sparkle">✨</span></div>

    <div class="sb-lbl">Business</div>
    <div class="sb-i" data-p="surgery" onclick="go('surgery',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Surgery Pipeline<span class="sb-badge" style="background:var(--blue)">28</span></div>
    <div class="sb-i" data-p="hospitals" onclick="go('hospitals',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M9 8h1M9 12h1M9 16h1M14 8h1M14 12h1M14 16h1M5 21V5a2 2 0 012-2h10a2 2 0 012 2v16"/></svg>Hospitals & Doctors</div>
    <div class="sb-i" data-p="finance" onclick="go('finance',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>Finance</div>
    <div class="sb-i" data-p="marketing" onclick="go('marketing',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>Marketing</div>

    <div class="sb-lbl">People</div>
    <div class="sb-i" data-p="team" onclick="go('team',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4-4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/></svg>Team Performance</div>
    <div class="sb-i" data-p="approvals" onclick="go('approvals',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>Approvals<span class="sb-badge" style="background:var(--orange)">5</span></div>

    <div class="sb-lbl">AI Tools</div>
    <div class="sb-i ai-item" data-p="ai-predict" onclick="go('ai-predict',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Revenue Predictor<span class="ai-sparkle">✨</span></div>
    <div class="sb-i ai-item" data-p="ai-expand" onclick="go('ai-expand',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>Expansion Advisor<span class="ai-sparkle">✨</span></div>
  </nav>
  <div class="sb-ft"><div class="sb-u"><div class="sb-av">YJ</div><div><div class="sb-nm">Yash Jain</div><div class="sb-rl">Managing Director</div></div></div></div>
</aside>

<div class="mn">
  <div class="tb">
    <button class="ham" onclick="togSB()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
    <div class="tb-l"><div class="tb-g" id="tbG"></div><div class="tb-t" id="tbT">Dashboard</div></div>
    <div class="tb-r">
      <div class="tb-dt" id="tbDt"></div>
      <div class="tb-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg><span class="tb-dot"></span></div>
    </div>
  </div>
  <div class="ct" id="ct"></div>
</div>

<script>
let curPage='home';
const titles={home:'MD Command Center','ai-daily':'AI Daily Brief',surgery:'Surgery Pipeline',hospitals:'Hospitals & Doctors',finance:'Finance Overview',marketing:'Marketing & Campaigns',team:'Team Performance',approvals:'Pending Approvals','ai-predict':'AI Revenue Predictor','ai-expand':'AI Expansion Advisor'};

function go(p,el){curPage=p;document.querySelectorAll('.sb-i').forEach(i=>i.classList.remove('on'));if(el)el.classList.add('on');render();closeSB()}
function togSB(){document.getElementById('sb').classList.toggle('open');document.getElementById('sOv').classList.toggle('show')}
function closeSB(){document.getElementById('sb').classList.remove('open');document.getElementById('sOv').classList.remove('show')}

function render(){
  document.getElementById('tbT').textContent=titles[curPage]||'Dashboard';
  const c=document.getElementById('ct');
  const fn={home:pgHome,'ai-daily':pgAIDaily,surgery:pgSurgery,hospitals:pgHospitals,finance:pgFinance,marketing:pgMarketing,team:pgTeam,approvals:pgApprovals,'ai-predict':pgAIPredict,'ai-expand':pgAIExpand};
  (fn[curPage]||pgHome)(c);
}

// ═══ HOME ═══
function pgHome(c){
  c.innerHTML=`
  <div class="ai-banner an d1">
    <div class="ai-banner-head"><span class="ai-banner-sparkle">✨</span><div class="ai-banner-title">AI Daily Summary — March 17, 2026</div><div class="ai-banner-time">Generated 8:30 AM</div></div>
    <div class="ai-banner-text">Good morning Yash. Yesterday MediEND processed <strong>12 surgeries</strong> across 4 cities with a <strong>₹18.2L GMV</strong>. Collection rate is at <strong>74%</strong> (↓3% from last week — flagged). <strong>Delhi NCR</strong> is outperforming other cities by 34%. <strong>3 approvals</strong> pending your action. Vikram Singh has <strong>3 overdue tasks</strong>.</div>
    <div class="ai-bullets">
      <div class="ai-bullet"><span class="ai-bullet-ic">🔴</span><strong>Alert:</strong> Hospital ABC Care has ₹8.2L outstanding for 45+ days — recommend escalation</div>
      <div class="ai-bullet"><span class="ai-bullet-ic">🟢</span><strong>Win:</strong> Gynecomastia conversions up 28% this month — Instagram campaign working</div>
      <div class="ai-bullet"><span class="ai-bullet-ic">🟡</span><strong>Action:</strong> 2 increment requests forwarded by HR, 1 leave extension pending</div>
    </div>
