services:
  postgres-staging:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: mediend_crm_staging
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata-staging:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mediend_crm_staging"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-staging:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        DEPLOY_COMMIT: ${DEPLOY_COMMIT:-unknown}
        DEPLOY_TIME: ${DEPLOY_TIME:-unknown}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3002}
    restart: always
    ports:
      - "127.0.0.1:3002:3000"
    env_file:
      - .env.staging
    depends_on:
      postgres-staging:
        condition: service_healthy

  # One-off: run Prisma migrations against staging DB
  # Usage: docker compose -f docker-compose.staging.yml --profile tools run --rm migrate-staging
  migrate-staging:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - .env.staging
    depends_on:
      postgres-staging:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["bunx", "prisma", "migrate", "deploy"]

  # One-off: seed master data against staging DB
  # Usage: docker compose -f docker-compose.staging.yml --profile tools run --rm seed-masters-staging
  seed-masters-staging:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - .env.staging
    depends_on:
      postgres-staging:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["bun", "run", "db:seed:masters"]

volumes:
  pgdata-staging:
